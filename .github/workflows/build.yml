name: Build containers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        source: [tailscale]
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.source }}
          file: ${{ matrix.source }}/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ghcr.io/martinemde/${{ matrix.source }}:main
            ghcr.io/martinemde/${{ matrix.source }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test without network or privileges
        run: docker run --rm --network none --entrypoint tailscale ghcr.io/martinemde/${{ matrix.source }}:sha-${{ github.sha }} --version
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/martinemde/${{ matrix.source }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:main"
          reference=$(docker image inspect "$IMAGE:sha-$REVISION" --format '{{index .RepoDigests 0}}')
          digest=${reference##*@}
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reference" > image-digest.txt
          printf 'Published `%s` (linux/amd64). This does not deploy a service.\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
      - name: Save immutable image reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.source }}-digest
          path: image-digest.txt
          if-no-files-found: error
