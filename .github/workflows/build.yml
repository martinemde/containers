name: Build containers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        source: [tailscale, rethink]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test source selection
        run: python3 -m unittest discover -s rethink -p test_source.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.source }}
          file: ${{ matrix.source }}/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ghcr.io/martinemde/${{ matrix.source }}:main
            ghcr.io/martinemde/${{ matrix.source }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test without network or privileges
        env:
          IMAGE: ghcr.io/martinemde/${{ matrix.source }}:sha-${{ github.sha }}
        run: sh "${{ matrix.source }}/test.sh" "$IMAGE"
