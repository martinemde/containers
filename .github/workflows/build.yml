name: Build containers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        source: [tailscale, rethink, nui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test source selection
        run: python3 -m unittest discover -s rethink -p test_source.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.source }}
          file: ${{ matrix.source }}/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ghcr.io/martinemde/${{ matrix.source }}:main
            ghcr.io/martinemde/${{ matrix.source }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test without network or privileges
        env:
          IMAGE: ghcr.io/martinemde/${{ matrix.source }}:sha-${{ github.sha }}
        run: sh "${{ matrix.source }}/test.sh" "$IMAGE"
