name: Publish Rethink

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rethink/**
      - .github/workflows/publish-rethink.yml

permissions:
  contents: read

concurrency:
  group: publish-rethink
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select current application main with successful push CI
        id: source
        run: python3 rethink/source.py >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build exact source for offline smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: rethink
          file: rethink/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/martinemde/rethink:run-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            RETHINK_REVISION=${{ steps.source.outputs.revision }}
            RETHINK_ARCHIVE_SHA256=${{ steps.source.outputs.archive_sha256 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=rethink
          cache-to: type=gha,mode=max,scope=rethink
      - name: Smoke test without network or privileges
        id: tested
        env:
          IMAGE: ghcr.io/martinemde/rethink:run-${{ github.run_id }}-${{ github.run_attempt }}
          APP_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          sh rethink/test.sh "$IMAGE" "$APP_REVISION"
          printf 'image_id=%s\n' "$(docker image inspect "$IMAGE" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish same tested image
        id: published
        env:
          TESTED_IMAGE_ID: ${{ steps.tested.outputs.image_id }}
          IMAGE: ghcr.io/martinemde/rethink:run-${{ github.run_id }}-${{ github.run_attempt }}
          APP_REVISION: ${{ steps.source.outputs.revision }}
          APP_CI_RUN: ${{ steps.source.outputs.ci_run }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$TESTED_IMAGE_ID"
          docker push "$IMAGE"
          reference=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          [[ "$reference" =~ ^ghcr.io/martinemde/rethink@sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${reference#*@}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reference" > image-digest.txt
          printf 'Published `%s` from application `%s` (CI run %s). No deployment performed.\n' "$reference" "$APP_REVISION" "$APP_CI_RUN" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest exact tested and pushed manifest digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/martinemde/rethink
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
      - name: Save immutable reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rethink-digest
          path: image-digest.txt
          if-no-files-found: error
