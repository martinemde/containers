name: Publish Rethink

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rethink/**
      - .github/workflows/publish-rethink.yml

permissions:
  contents: read

concurrency:
  group: publish-rethink
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select current application main with successful push CI
        id: source
        run: python3 rethink/source.py >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build exact source for offline smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: rethink
          file: rethink/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/martinemde/rethink:run-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            RETHINK_REVISION=${{ steps.source.outputs.revision }}
            RETHINK_ARCHIVE_SHA256=${{ steps.source.outputs.archive_sha256 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=rethink
          cache-to: type=gha,mode=max,scope=rethink
      - name: Smoke test without network or privileges
        env:
          IMAGE: ghcr.io/martinemde/rethink:run-${{ github.run_id }}-${{ github.run_attempt }}
          APP_REVISION: ${{ steps.source.outputs.revision }}
        run: sh rethink/test.sh "$IMAGE" "$APP_REVISION"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish same tested image
        env:
          IMAGE: ghcr.io/martinemde/rethink:run-${{ github.run_id }}-${{ github.run_attempt }}
          APP_REVISION: ${{ steps.source.outputs.revision }}
          APP_CI_RUN: ${{ steps.source.outputs.ci_run }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          reference=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$reference" > image-digest.txt
          printf 'Published `%s` from application `%s` (CI run %s). No deployment performed.\n' "$reference" "$APP_REVISION" "$APP_CI_RUN" >> "$GITHUB_STEP_SUMMARY"
      - name: Save immutable reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rethink-digest
          path: image-digest.txt
          if-no-files-found: error
